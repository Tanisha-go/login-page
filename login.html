<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="Login-page">
        
    <div class="login">
        <div class="heading">
            <h3>&#9889 Log in to wormhole</h3>
        </div>
        
        <div class="login-form">
            <form>
                <label class="label">Email address*</label><br>
                <div class="eye-icon">
               <div> <input type="text" name="Email address" id="101"></div>
              
            </div>
            <br><br>
                <label class="label">Password*</label><br>
                <div class="eye-icon">
                    <div>
                        <input type="password" name="password" id="102"><br><br><br>
                    </div>
                    <div class="eye">
                        <i class="material-icons toggle-password">visibility</i>
                    </div>
                </div>
                <br>
                <br>
                <button class="login-button"><b>Log in</b></button><br><br>
            </form>
            <div class="ORLINE">
            <div class="line"><hr></div>
            <div>OR</div>
            <div class="line"><hr></div>
            </div>
            <button class="Google-button"><img src="google-Photoroom.png" alt="Google-icon" class="google-icon">Continue with Google</button><br>
            <button class="Enterprise-button"><img src="enterprise-Photoroom.png" alt="enterprise-icon" class="enterprise-icon">Your Enterprise email [SSO]</button>
            <br><br>
            
            <div class="line1"><hr></div><br>
            <div class="forgot">
                <a href="/reset.html" > <p>Forgot password</p> </a>
                <p style="display: inline;text-decoration: none; margin-left: 60px;">Have an account? <a href="/create_account.html"><span style="color:aquamarine">Sign in</span></p></a>

            </div>
        </div>
    </div>
</div>
</body>
</html>
