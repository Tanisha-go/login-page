<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="create_account.css">
</head>
<body>
    <div id="Login-page">
        
    <div class="login">
        <div class="heading">
            <h3>&#10024 Create an account</h3>
        </div>
        
        <div class="login-form">
            <form>
                <label class="label">Name*</label><br>
                <input type="text" name="Email address" id="103"><br><br>
                <label class="label">Email address*</label><br>
                <input type="text" name="Email address" id="101"><br><br>
                <label class="label">Password*</label><br>
                <input type="password" name="password" id="102"><br><br><br>
                <button class="login-button"><b>Get started now</b></button><br><br>
            </form>
            <div class="ORLINE">
            <div class="line"><hr></div>
            <div>OR</div>
            <div class="line"><hr></div>
            </div>
            <!-- <div class="line"><hr></div> -->
            <button class="Google-button"><img src="google-Photoroom.png" alt="Google-icon" class="google-icon">Continue with Google</button><br>
            <button class="Enterprise-button"><img src="enterprise-Photoroom.png" alt="enterprise-icon" class="enterprise-icon">Your Enterprise email [SSO]</button>
            <br><br>
            
            <div class="line1"><hr></div><br>
            <div class="forgot">
                <p>Forgot password</p>
                <p style="display: inline;text-decoration: none; margin-left: 60px;">Have an account? <span style="color:aquamarine">Sign in</span></p>
                

            </div>
        </div>
    </div>
</div>
</body>
</html>
