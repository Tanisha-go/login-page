<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password Page</title>
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <div id="Login-page">
        
    <div class="login">
        <div class="heading">
            <h3>&#128260 Reset your password</h3>
        </div>
        
        <div class="login-form">
            <form>
                <label class="label">Email address*</label><br>
                <input type="text" name="Email address" id="101"><br><br>
                <label class="label">New Password*</label><br>
                <input type="password" name="password" id="102"><br><br><br>
                <label class="label">Confirm Password*</label><br>
                <input type="password" name="password" id="103"><br><br><br>
                <button class="login-button"><b>Reset my password</b></button><br><br>
                
            </form>
       
        </div>
    </div>
</div>
</body>
</html>
